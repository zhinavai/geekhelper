### 💡 關於 JKS 簽名（如果你想在 GitHub 自動打包 Release 簽名版）
既然你已經有了 `.jks` 簽名檔，如果希望 GitHub Actions 在編譯時自動幫你用這個 `.jks` 簽名，通常需要做兩步：
1. **將 JKS 轉為 Base64**：把你的 `.jks` 檔案轉成字串，並放到 GitHub 專案的 **Settings > Secrets and variables > Actions** 中（例如命名為 `KEYSTORE_BASE64`）。
2. **在 workflow 中還原並配置 gradle 簽名屬性**。

如果你目前只是想先用最簡單的 Debug 版跑通 GitHub Actions，直接把上面這段 `build.yml` 提交上去就可以了！

