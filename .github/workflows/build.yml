name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # 🌟 加上這行，你就可以直接在 GitHub 網頁上按「Run workflow」手動觸發！

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 🌟 修正為 v4 並加上 accept-licenses 解決 sdkmanager 報錯
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        accept-licenses: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      env:
        SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeekHelper-TV-Release
        path: app/build/outputs/apk/release/app-release.apk
